<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Traffic Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <link rel="stylesheet" href="/static/css/custom.css" />
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <!-- Sidebar -->
  <div class="flex h-screen overflow-hidden">
    <aside class="w-56 bg-gray-900 text-gray-100 flex flex-col flex-shrink-0">
      <div class="px-5 py-6 border-b border-gray-700">
        <div class="text-xl font-bold text-white">NetWatch</div>
        <div class="text-xs text-gray-400 mt-0.5">Traffic Monitor</div>
      </div>
      <nav class="flex-1 px-3 py-4 space-y-1">
        <a href="#dashboard" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition-colors">
          <span class="text-lg">📊</span> Dashboard
        </a>
        <a href="#timeline" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition-colors">
          <span class="text-lg">🕐</span> Timeline
        </a>
        <a href="#log" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition-colors">
          <span class="text-lg">📋</span> Traffic Log
        </a>
        <a href="#reports" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition-colors">
          <span class="text-lg">📈</span> Reports
        </a>
        <a href="#employees" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition-colors">
          <span class="text-lg">👥</span> Employees
        </a>
        <a href="#settings" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition-colors">
          <span class="text-lg">⚙️</span> Settings
        </a>
      </nav>
      <div class="px-4 py-3 border-t border-gray-700 text-xs text-gray-500" id="live-counter">
        Requests: —
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-auto">
      <div id="page-content" class="p-6">
        <div class="text-center text-gray-400 mt-20">Loading…</div>
      </div>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
