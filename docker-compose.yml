version: "3.9"

services:
  monitor:
    build: .
    ports:
      - "8080:8080"   # Proxy
      - "8000:8000"   # Dashboard
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/traffic.db
      - PROXY_PORT=8080
      - API_PORT=8000
      - DEFAULT_TIMEZONE=UTC
    restart: unless-stopped
